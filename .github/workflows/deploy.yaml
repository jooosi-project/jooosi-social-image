name: Deploy the plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  release:
    if: github.repository == 'jooosi-project/jooosi-egami'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "content<<EOF"
            node deploy/extract-changelog.mjs "$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update WordPress.org changelog
        run: node deploy/update-readme-changelog.mjs

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --ansi

      - name: Prepare production source
        run: |
          mkdir -p jooosi-egami-deploy
          rsync -a --exclude jooosi-egami-deploy --exclude .git ./ jooosi-egami-deploy/
          composer install --working-dir=jooosi-egami-deploy --no-dev --classmap-authoritative --no-interaction --prefer-dist --ansi

      - name: Scope production dependencies
        run: bash deploy/deploy-scoped.sh jooosi-egami-deploy jooosi-egami-prefixed

      - name: Apply distribution filter
        run: |
          mkdir -p jooosi-egami-final
          rsync -a --exclude-from=.distignore jooosi-egami-prefixed/ jooosi-egami-final/
          rm -rf jooosi-egami-prefixed
          mv jooosi-egami-final jooosi-egami-prefixed

      - name: Create plugin archive
        run: |
          mkdir -p jooosi-egami-zip/jooosi-egami
          cp -a jooosi-egami-prefixed/. jooosi-egami-zip/jooosi-egami/
          cd jooosi-egami-zip
          zip -qr "../jooosi-egami-${GITHUB_REF_NAME}.zip" . -x "*.git*" "*.DS_Store*"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jooosi-egami-${{ github.ref_name }}
          path: jooosi-egami-${{ github.ref_name }}.zip

      - name: Publish WordPress.org release
        if: vars.WORDPRESS_ORG_DEPLOY == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: jooosi-egami
          BUILD_DIR: jooosi-egami-prefixed
          VERSION: ${{ github.ref_name }}
          ASSETS_DIR: .wordpress-org

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: jooosi-egami-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
